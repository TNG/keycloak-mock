name: Update verification metadata

on:
  pull_request:
    paths:
      - 'gradle/libs.versions.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'build-logic/**/build.gradle.kts'
      - '**/build.gradle.kts'
  workflow_dispatch:
    # manual re-run, e.g. after dependabot updated an existing PR

# The commit is pushed via a GitHub App installation token, so the default
# token only needs read access.
permissions:
  contents: read

jobs:
  regenerate:
    # Only allow on pull requests opened by dependabot.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if metadata already updated
        if: github.event_name == 'pull_request'
        id: skip
        run: |
          if [ "$(git log -1 --format='%s')" = "update verification metadata for dependabot dependency bump" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Head commit is already the verification metadata update; nothing to do."
          fi

      - name: Set up JDK 25
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Regenerate dependency verification metadata
        if: steps.skip.outputs.skip != 'true'
        run: ./gradlew --write-verification-metadata sha256 --dependency-verification strict --refresh-dependencies build

      - name: Guard against altered existing entries
        if: steps.skip.outputs.skip != 'true'
        run: bash scripts/check-verification-metadata-additive.sh

      - name: Generate app installation token
        id: app-token
        if: steps.skip.outputs.skip != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.METADATA_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.METADATA_UPDATER_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit updated metadata
        if: steps.skip.outputs.skip != 'true'
        # Committing via the REST API makes GitHub sign the commit, so it shows
        # up as "Verified" and satisfies the signed-commits branch protection.
        uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          commit_message: update verification metadata for dependabot dependency bump
          files: gradle/verification-metadata.xml
          fail_on_self_push: false
