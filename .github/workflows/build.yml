name: Java CI

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  check_commit_hooks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Set up JDK 25
        uses: actions/setup-java@v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Run pre-commit check
        uses: cloudposse/github-action-pre-commit@ed9906221c8a4ee1dcb1e665da895998e0f7b396 #v4.1.0

  build_java:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build with Gradle
        run: ./gradlew build
      - name: Run sonar analysis
        # As the secrets below are only correctly stored within our github account,
        # we need to disable the sonar run for forked repositories. Otherwise, remote
        # PRs would not be able to pass the CI check.
        if: ${{ github.repository == 'TNG/keycloak-mock' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_LOGIN }}
        run: ./gradlew sonar
      - name: Run integration tests
        run: ./gradlew e2e
      - name: Publish test report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 #v6
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: JUnit Test Report
      - name: Upload cypress output
        uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: test-reports-js
          path: |
            */cypress/screenshots/
            */cypress/videos/
          # e2e tests will not be run if unit tests fail, so it is ok if we find no artifacts
          if-no-files-found: ignore
