org.gradle.console=plain
org.gradle.dependency.verification=STRICT
org.gradle.warning.mode=all
# Consider a JDK 8 pointed to by this environment variable (set by setup-java in CI)
# when resolving the production toolchain, so that Gradle does not need to
# download a JDK via the foojay resolver.
org.gradle.java.installations.fromEnv=JAVA_HOME_8_x64
